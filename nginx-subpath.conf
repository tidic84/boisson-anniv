# Configuration Nginx pour tidic.fr/anniv-emma
# À ajouter dans votre fichier de configuration Nginx existant pour tidic.fr

# IMPORTANT: L'ordre des locations est important !
# Les plus spécifiques DOIVENT être AVANT les plus générales

# 1. API Backend - Proxy vers Node.js
location /anniv-emma/api/ {
    rewrite ^/anniv-emma/api/(.*)$ /api/$1 break;
    proxy_pass http://localhost:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

# 2. Frontend React - Tous les fichiers
location /anniv-emma {
    alias /var/www/birthday-brunch/frontend/build;
    index index.html;
    try_files $uri $uri/ /anniv-emma/index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
